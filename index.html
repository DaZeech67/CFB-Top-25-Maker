<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CFB Top 25 Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#111;--ink:#fff;--mute:#9a9a9a;--line:#2e2e2e;--hl:#1c1c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,sans-serif}
header{background:#000;border-bottom:1px solid var(--line);padding:20px 16px}
.wrap{max-width:1040px;margin:0 auto}
h1{font:600 clamp(30px,6.5vw,50px)/1 Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:1px;margin:0 0 12px}
#title{width:100%;max-width:520px;font:600 18px Barlow,sans-serif;padding:9px 12px;border:2px solid #3a3a3a;border-radius:6px;background:#0d0d0d;color:#fff}
#title::placeholder{color:#8a8a8a}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding:18px 16px 40px}
@media(max-width:800px){main{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
h2{font:600 24px Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:1px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font:400 14px Barlow;color:var(--mute)}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{position:relative;aspect-ratio:1/1.12;border:2px dashed #3a3a3a;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 2px 2px;background:#0a0a0a;cursor:pointer;min-width:0}
.slot.full{border-style:solid;background:transparent;cursor:grab}
.slot.active{border-color:#fff;box-shadow:0 0 0 2px #fff}
.slot.over{outline:2px solid #fff}
.slot img,.tm img{filter:drop-shadow(0 0 1px rgba(255,255,255,.85))}
.slot img{width:60%;height:46%;object-fit:contain;pointer-events:none}
.num{position:absolute;top:2px;left:5px;font:600 19px/1 Oswald,Impact,sans-serif;color:#fff}
.nm{color:#fff;font-size:10px;line-height:1.1;font-weight:600;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.x{position:absolute;top:1px;right:1px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:12px;line-height:1;padding:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.slot:focus-visible,.tm:focus-visible{outline:3px solid #fff;outline-offset:1px}
#q{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:#0a0a0a;color:#fff;font:inherit;margin-bottom:8px}
#pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;max-height:560px;overflow:auto}
.tm{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border:1px solid var(--line);border-radius:6px;background:transparent;cursor:pointer;min-width:0;color:#fff}
.tm:hover{background:var(--hl)}
.tm img{width:40px;height:40px;object-fit:contain}
.tm span{font-size:10px;line-height:1.1;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{background:#fff;color:#000;border:0;border-radius:6px;padding:9px 14px;font-weight:600}
.btn.alt{background:none;color:#fff;border:1px solid #444}
.btn:disabled{opacity:.5}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:nowrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{flex:none}
h1.bt{margin:0;display:flex;flex-direction:column;line-height:1;font:inherit;text-transform:none;letter-spacing:0}
.b1{font:600 clamp(30px,7vw,44px)/1 Oswald,Impact,sans-serif;letter-spacing:3px}
.b2{font:500 clamp(9px,2.3vw,13px)/1.2 Oswald,Impact,sans-serif;letter-spacing:.3em;color:#a8a8a8;margin-top:3px;white-space:nowrap}
.authbar{display:flex;gap:8px;align-items:center;position:relative;flex:none}
.authbar .btn{padding:8px 12px;font-size:14px}
.prof{display:flex;align-items:center;gap:8px;background:none;border:1px solid #444;border-radius:999px;padding:3px 14px 3px 3px;color:#fff;font:600 14px Barlow,sans-serif}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 16px Oswald,Impact,sans-serif;color:#fff}
#pmenu{position:absolute;right:0;top:calc(100% + 8px);background:#111;border:1px solid var(--line);border-radius:8px;padding:12px;min-width:210px;z-index:6}
#pmenu[hidden]{display:none}.pm1{font-weight:600}.pm2{font-size:13px;color:#9a9a9a;margin-bottom:10px;overflow-wrap:anywhere}
@media(max-width:520px){.pn{display:none}.prof{padding:3px}.logo{width:40px;height:40px}}
#auth{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}#auth[hidden]{display:none}
#auth .card{background:#111;border:1px solid var(--line);border-radius:10px;padding:18px;width:100%;max-width:380px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;background:none;color:#9a9a9a;border:0;border-bottom:2px solid #333;padding:8px;font:600 18px Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:1px}.tab.on{color:#fff;border-color:#fff}
.f{display:block;margin:0 0 10px;font-size:14px;color:#bbb}.f[hidden]{display:none}
.f input{display:block;width:100%;margin-top:4px;padding:9px 12px;border:1px solid #444;border-radius:6px;background:#0a0a0a;color:#fff;font:inherit;font-size:16px}
#aerr{min-height:20px;font-size:14px;color:#f87171;margin:0 0 8px}
.meta{display:flex;gap:5px;align-items:center;justify-content:center;font:600 10px/1.3 Barlow,sans-serif;min-height:13px}
.rec{color:#fff;opacity:.9}.tr.up{color:#4ade80}.tr.dn{color:#f87171}.tr.eq{color:#a0a0a0}.tr.nw{color:#60a5fa}
.opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.opts label{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.opts input{accent-color:#fff;width:16px;height:16px}
#week{background:#0a0a0a;color:#fff;border:1px solid #444;border-radius:6px;padding:7px 10px;font:600 15px Barlow,sans-serif}
#note{font-size:13px;color:var(--mute);margin:0 0 10px;min-height:18px}
#acct{margin:10px 0 0;font-size:13px;color:#9a9a9a}#acct a{color:#fff}
#msg,#rmsg,.empty{font-size:14px;color:var(--mute)}
.empty{grid-column:1/-1;padding:8px}
#res{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:5}
#res[hidden]{display:none}
#res .in{max-width:560px;margin:0 auto}
#resimg{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin:10px 0}
#out{display:none;width:100%;height:140px;margin-top:10px;font:14px/1.4 ui-monospace,monospace;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
</style></head><body>
<header><div class="wrap"><div class="top"><div class="brand"><svg class="logo" viewBox="0 0 48 48" width="50" height="50" aria-hidden="true"><path d="M24 3 43 9v15c0 11-8 18-19 22C13 42 5 35 5 24V9Z" fill="#0a0a0a" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><g transform="rotate(-35 24 23)"><ellipse cx="24" cy="23" rx="14" ry="8" fill="#fff"/><path d="M12 23h24M19 20.5v5M22.500 20v6M25.500 20v6M29 20.500v5" stroke="#0a0a0a" stroke-width="1.6" fill="none"/><path d="M14 19.500c-1 2-1 5 0 7M34 19.500c1 2 1 5 0 7" stroke="#0a0a0a" stroke-width="1.4" fill="none"/></g><path d="M14 36.500h20" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/></svg><h1 class="bt" aria-label="CFB Top 25 Maker"><span class="b1">CFB</span><span class="b2">TOP 25 MAKER</span></h1></div><div id="authbar" class="authbar"><button class="btn alt" id="bLogin">Log in</button><button class="btn" id="bSign">Sign up</button></div></div>
<input id="title" aria-label="Ranking title" maxlength="60" placeholder="Name your ranking, e.g. My Week 6 Poll">
<p id="acct" role="status"></p></div></header>
<div class="wrap"><main>
<section><h2>Your Top 25 <small id="count">0 of 25</small></h2>
<div class="opts"><select id="week" aria-label="Week"></select>
<label><input type="checkbox" id="tTrend">Show trends</label><label><input type="checkbox" id="tRec">Show records</label></div>
<p id="note"></p>
<div id="grid" aria-label="Your Top 25, ranked left to right, top to bottom"></div>
<div class="bar"><button class="btn" id="submit">Submit ranking</button><button class="btn alt" id="clear">Clear all</button><span id="msg" role="status"></span></div>
</section>
<section><h2>All 138 FBS teams <small id="left"></small></h2>
<input id="q" type="search" placeholder="Search teams" aria-label="Search teams">
<div id="pool"></div></section>
</main></div>
<div id="auth" hidden role="dialog" aria-modal="true" aria-label="Log in or sign up"><div class="card">
<div class="tabs"><button class="tab on" id="tLogin">Log in</button><button class="tab" id="tSign">Sign up</button></div>
<label class="f">Email<input id="aemail" type="email" autocomplete="email" inputmode="email"></label>
<label class="f" id="anameWrap" hidden>Display name (optional)<input id="aname" autocomplete="nickname" maxlength="30"></label>
<label class="f">Password<input id="apass" type="password" autocomplete="current-password"></label>
<label class="f" id="aconfWrap" hidden>Confirm password<input id="aconf" type="password" autocomplete="new-password"></label>
<p id="aerr" role="alert"></p>
<div class="bar" style="margin-top:0"><button class="btn" id="asubmit">Log in</button><button class="btn alt" id="acancel">Cancel</button></div>
</div></div>
<div id="res" hidden role="dialog" aria-label="Your finished Top 25"><div class="in">
<h2>Your finished Top 25 <small id="rmsg" role="status"></small></h2>
<div class="opts"><label><input type="checkbox" id="rTrend">Show trends</label><label><input type="checkbox" id="rRec">Show records</label></div>
<p id="rnote" style="font-size:13px;color:var(--mute);margin:0;min-height:18px"></p>
<img id="resimg" alt="Your Top 25 as a 5 by 5 grid">
<div class="bar"><button class="btn" id="cimg">Copy image</button><button class="btn" id="clist">Copy list</button><button class="btn" id="share">Share</button><button class="btn alt" id="back">Back to edit</button></div>
<p id="hint" style="font-size:14px;color:var(--mute)">If copying is blocked here, press and hold the image (or right-click it) to save or copy it.</p>
<textarea id="out" readonly aria-label="Ranking text"></textarea>
</div></div>

  c.fillStyle="#fff";c.textAlign="left";c.font="600 28px Oswald, Impact, sans-serif";c.fillText(String(i+1),x+12,y+26);
  if(!t)return;
  const im=imgs[i];if(im){const k=Math.min(104/im.width,104/im.height);c.save();c.shadowColor="rgba(255,255,255,.8)";c.shadowBlur=4;c.drawImage(im,x+cs/2-im.width*k/2,y+36+(104-im.height*k)/2,im.width*k,im.height*k);c.restore()}
  c.fillStyle="#fff";c.textAlign="center";fit(c,t,"600 #px Barlow, sans-serif",cs-14,19);c.fillText(t,x+cs/2,y+ch-42);
  const parts=[];
  if(p){const r=trend(t,i,p);parts.push({s:r.s,col:{up:"#4ade80",dn:"#f87171",eq:"#a0a0a0",nw:"#60a5fa"}[r.c]})}
  if(prefs.records)parts.push({s:REC[t]||"",col:"#fff"});
  if(parts.length){c.font="600 17px Barlow, sans-serif";const gp=10,ws=parts.map(q=>c.measureText(q.s).width),tot=ws.reduce((a,b)=>a+b,0)+gp*(parts.length-1);let px=x+cs/2-tot/2;c.textAlign="left";parts.forEach((q,k)=>{c.fillStyle=q.col;c.fillText(q.s,px,y+ch-18);px+=ws[k]+gp})}
 });
 return new Promise(r=>cv.toBlob(r,"image/png"));
}
async function buildResult(){
 blob=await makeImage();const old=$("#resimg").src;$("#resimg").src=URL.createObjectURL(blob);if(old.startsWith("blob:"))URL.revokeObjectURL(old);
 $("#rTrend").checked=prefs.trends;$("#rRec").checked=prefs.records;
 const p=prefs.trends?prevData():null;
 $("#rnote").textContent=[prefs.trends?(p?`Trends compare with ${WK(p.w)}.`:"Fill in an earlier week to see trends."):"",prefs.records?`Records as of ${REC_DATE}.`:""].filter(Boolean).join(" ");
}
for(const [id,k,mid] of [["#rTrend","trends","#tTrend"],["#rRec","records","#tRec"]])$(id).onchange=async e=>{prefs[k]=e.target.checked;$(mid).checked=prefs[k];render();try{await buildResult()}catch(x){flash("Could not update the image.")}};
$("#submit").onclick=async()=>{
 const n=slots.filter(Boolean).length;
 if(n<25){flash(`Fill all 25 spots first. ${25-n} left.`);return}
 $("#submit").disabled=true;
 try{await buildResult();
  $("#res").hidden=false;$("#res").scrollTop=0;$("#back").focus()}
 catch(e){flash("Could not build the image. Try again.")}
 $("#submit").disabled=false;
};
$("#back").onclick=()=>{$("#res").hidden=true;$("#submit").focus()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#res").hidden)$("#back").click()});
async function copyList(){
 const o=$("#out");o.value=text();
 try{await navigator.clipboard.writeText(o.value);o.style.display="none";flash("List copied.")}
 catch(e){o.style.display="block";o.select();flash("Select the text below and copy it.")}
}
$("#clist").onclick=copyList;
$("#cimg").onclick=async()=>{
 try{await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);flash("Image copied.")}
 catch(e){flash("Copying is blocked here. Press and hold the image to save it.")}
};
$("#share").onclick=async()=>{
 const f=new File([blob],"my-top-25.png",{type:"image/png"}),ttl=wkTitle();
 try{
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:ttl,text:text()});
  else if(navigator.share)await navigator.share({title:ttl,text:text()});
  else{await copyList()}
 }catch(e){if(e.name!=="AbortError")copyList()}
};
render();
</script></body></html>
